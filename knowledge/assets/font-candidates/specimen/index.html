<!doctype html><html><head><meta charset="utf-8"><title>Subtitle font candidates</title>
<style>
@font-face{font-family:"F_Bodoni";src:url("BodoniModa-VF.ttf");font-weight:400 900}
@font-face{font-family:"F_SourceSerif";src:url("SourceSerif4.ttf");font-weight:200 900}
@font-face{font-family:"F_Baskerville";src:url("LibreBaskerville.ttf");font-weight:400 700}
@font-face{font-family:"F_Lora";src:url("Lora.ttf");font-weight:400 700}
@font-face{font-family:"F_Garamond";src:url("EBGaramond.ttf");font-weight:400 800}
@font-face{font-family:"F_Merriweather";src:url("Merriweather.ttf");font-weight:300 900}
@font-face{font-family:"F_SourceSans";src:url("SourceSans3.ttf");font-weight:200 900}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
const ctx=document.getElementById('c').getContext('2d');
const TXT=["Facing him: tens of thousands of soldiers,","a twenty-one-year-old sultan, and a very large cannon."];
const F=[
 ["A  Bodoni Moda 600  (current, hard to read)","F_Bodoni",600,35],
 ["B  Source Serif 4 600  \u2014 clean, sturdy, very readable","F_SourceSerif",600,36],
 ["C  Libre Baskerville 700  \u2014 classic book feel","F_Baskerville",700,31],
 ["D  Lora 600  \u2014 warm, calligraphic","F_Lora",600,35],
 ["E  EB Garamond 600  \u2014 period look, lighter","F_Garamond",600,39],
 ["F  Merriweather 700  \u2014 widest, made for screens","F_Merriweather",700,31],
 ["G  Source Sans 3 600  \u2014 plain sans (most legible)","F_SourceSans",600,36]];
(async()=>{
 await Promise.all(F.map(f=>document.fonts.load(`${f[2]} 30px "${f[1]}"`)));
 await document.fonts.load('600 20px "F_SourceSans"');
 window.render=()=>{
  ctx.fillStyle='#dcc99d';ctx.fillRect(0,0,1920,1080);
  const g=ctx.createLinearGradient(0,0,0,1080);g.addColorStop(0,'rgba(255,255,255,.12)');g.addColorStop(1,'rgba(0,0,0,.06)');ctx.fillStyle=g;ctx.fillRect(0,0,1920,1080);
  F.forEach((f,i)=>{
    const y=16+i*152, h=136;
    ctx.fillStyle='#2b1e14';ctx.font='600 20px "F_SourceSans"';ctx.textAlign='left';ctx.fillText(f[0],40,y+30);
    const x0=520,w=1360;
    ctx.save();ctx.shadowColor='rgba(60,40,20,.3)';ctx.shadowBlur=12;ctx.shadowOffsetY=4;ctx.fillStyle='#f7f1e0';ctx.fillRect(x0,y,w,h);ctx.restore();
    ctx.fillStyle='#1c1510';ctx.textAlign='center';ctx.font=`${f[2]} ${f[3]}px "${f[1]}"`;
    ctx.fillText(TXT[0],x0+w/2,y+52);ctx.fillText(TXT[1],x0+w/2,y+52+f[3]*1.3);
  });
 };
 window.DUR=1;window.READY=true;
})();
</script></body></html>
